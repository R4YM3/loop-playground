name: Deploy fixture

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        required: true
        options: [staging, production]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-staging:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'staging' || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: staging-deployment-${{ github.sha }}
          path: dist
      - run: echo "Staging artifact created. No external hosting is configured."
  deploy-production:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: production-deployment-${{ github.sha }}
          path: dist
      - run: echo "Production artifact created. No external hosting is configured."
